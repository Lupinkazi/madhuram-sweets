<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Demo illustration: cashew fudge being cut into diamonds on a board</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE2CF"/><stop offset="1" stop-color="#D9C4A2"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A6A3A"/><stop offset="1" stop-color="#6B4422"/></linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6EAD2"/><stop offset="1" stop-color="#DCC49C"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4F2EE"/><stop offset="1" stop-color="#A9A39A"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="sheetClip"><rect x="190" y="360" width="520" height="520" rx="18"/></clipPath>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="140" y="320" width="640" height="640" rx="30" fill="#3E2412" opacity="0.3" filter="url(#blur)"/>
  <rect x="120" y="290" width="660" height="640" rx="30" fill="url(#board)"/>
  <rect x="190" y="360" width="520" height="520" rx="18" fill="url(#sheet)"/>
  <g clip-path="url(#sheetClip)" stroke="#BFA06F" stroke-width="3">
    <path d="M100 360 L620 880M200 360 L720 880M300 360 L820 880M0 360 L520 880M-100 360 L420 880M400 360 L920 880"/>
    <path d="M800 360 L280 880M700 360 L180 880M600 360 L80 880M900 360 L380 880M1000 360 L480 880M500 360 L-20 880"/>
  </g>
  <g fill="#FFFFFF" opacity="0.4"><path d="M230 400h80l-40 40z"/><path d="M430 420h80l-40 40z"/></g>
  <path d="M640 220 L460 640" stroke="#24543A" stroke-width="30" stroke-linecap="round"/>
  <path d="M470 610 L360 860 L400 870 L500 630 Z" fill="url(#blade)"/>
  <g fill="#E9D6B3" stroke="#C7AE84"><polygon points="200,1020 240,1000 280,1020 240,1040"/><polygon points="300,1050 340,1030 380,1050 340,1070"/><polygon points="560,1040 600,1020 640,1040 600,1060"/></g>
