<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Demo illustration: laddoos and mysore pak on a brass plate</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.25" r="0.95"><stop offset="0" stop-color="#F6E7CF"/><stop offset="1" stop-color="#E2CBA6"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBC77E"/><stop offset="0.5" stop-color="#C99543"/><stop offset="1" stop-color="#8C6222"/></linearGradient>
    <radialGradient id="laddoo" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#F7C46A"/><stop offset="0.6" stop-color="#E39A33"/><stop offset="1" stop-color="#A9621D"/></radialGradient>
    <linearGradient id="pak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0C25E"/><stop offset="1" stop-color="#C98A2B"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.1" fill="#FFF0CC" opacity="0.45"/><circle cx="9" cy="9" r="2" fill="#9E5A18" opacity="0.4"/></pattern>
    <pattern id="pores" width="18" height="14" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.4" fill="#A86E1E" opacity="0.4"/><circle cx="13" cy="10" r="1.8" fill="#A86E1E" opacity="0.35"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="l"><ellipse cx="4" cy="46" rx="50" ry="12" fill="#3E2412" opacity="0.3" filter="url(#blur2)"/><circle r="54" fill="url(#laddoo)"/><circle r="54" fill="url(#dots)"/><ellipse cx="-17" cy="-22" rx="15" ry="9" fill="#FFF6DD" opacity="0.45"/></g>
    <g id="m"><ellipse cx="4" cy="38" rx="62" ry="10" fill="#3E2412" opacity="0.28" filter="url(#blur2)"/><rect x="-62" y="-36" width="124" height="72" rx="8" fill="url(#pak)"/><rect x="-62" y="-36" width="124" height="72" rx="8" fill="url(#pores)"/><rect x="-62" y="-36" width="124" height="14" rx="7" fill="#F8D98E" opacity="0.6"/></g>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="610" cy="660" rx="470" ry="100" fill="#3E2412" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="600" cy="540" rx="480" ry="220" fill="url(#brass)"/>
  <ellipse cx="600" cy="530" rx="440" ry="196" fill="#E8BE6E"/>
  <ellipse cx="600" cy="530" rx="420" ry="182" fill="none" stroke="#8C6222" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <use href="#l" xlink:href="#l" x="420" y="500"/><use href="#l" xlink:href="#l" x="530" y="500"/><use href="#l" xlink:href="#l" x="475" y="420"/>
  <use href="#l" xlink:href="#l" x="360" y="590"/><use href="#l" xlink:href="#l" x="470" y="600"/>
  <use href="#m" xlink:href="#m" x="740" y="470"/><use href="#m" xlink:href="#m" x="870" y="520"/><use href="#m" xlink:href="#m" x="720" y="580"/><use href="#m" xlink:href="#m" x="850" y="630"/>
  <g fill="#8FA36A"><ellipse cx="480" cy="372" rx="9" ry="4" transform="rotate(20 480 372)"/><ellipse cx="500" cy="380" rx="9" ry="4" transform="rotate(-30 500 380)"/></g>
  <g fill="#A8323F" opacity="0.85"><ellipse cx="160" cy="760" rx="16" ry="8" transform="rotate(20 160 760)"/><ellipse cx="1040" cy="200" rx="16" ry="8" transform="rotate(-30 1040 200)"/><ellipse cx="1080" cy="780" rx="16" ry="8" transform="rotate(50 1080 780)"/></g>
  <text x="1176" y="880" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#786B61">Demo illustration</text>
</svg>
