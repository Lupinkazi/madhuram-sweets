<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1300" width="1200" height="1300">
  <title>Demo illustration: a brass thali of assorted Indian sweets</title>
  <defs>
    <radialGradient id="light" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#3A7653"/>
      <stop offset="0.55" stop-color="#24543A"/>
      <stop offset="1" stop-color="#183D2B"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9C27A"/>
      <stop offset="0.45" stop-color="#C99543"/>
      <stop offset="1" stop-color="#8C6222"/>
    </linearGradient>
    <radialGradient id="brassInner" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#F3D99E"/>
      <stop offset="1" stop-color="#B3802F"/>
    </radialGradient>
    <linearGradient id="katli" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EAD2"/>
      <stop offset="1" stop-color="#D9C29C"/>
    </linearGradient>
    <radialGradient id="laddoo" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F7C46A"/>
      <stop offset="0.6" stop-color="#E39A33"/>
      <stop offset="1" stop-color="#A9621D"/>
    </radialGradient>
    <radialGradient id="jamun" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9A4A2E"/>
      <stop offset="0.6" stop-color="#5B2318"/>
      <stop offset="1" stop-color="#2E0F09"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="2.4" fill="#FFF0CC" opacity="0.45"/>
      <circle cx="10" cy="10" r="2.2" fill="#9E5A18" opacity="0.4"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="katliPiece">
      <ellipse cx="4" cy="16" rx="70" ry="16" fill="#0E2418" opacity="0.28" filter="url(#softer)"/>
      <polygon points="0,-40 74,0 0,40 -74,0" fill="url(#katli)" stroke="#C7AE84" stroke-width="2"/>
      <polygon points="0,-40 74,0 0,-10" fill="#FFFFFF" opacity="0.42"/>
      <polygon points="-74,0 0,40 0,30 -62,0" fill="#B99C6E" opacity="0.4"/>
    </g>
    <g id="laddooPiece">
      <ellipse cx="6" cy="54" rx="58" ry="14" fill="#0E2418" opacity="0.32" filter="url(#softer)"/>
      <circle r="62" fill="url(#laddoo)"/>
      <circle r="62" fill="url(#dots)"/>
      <ellipse cx="-20" cy="-26" rx="18" ry="11" fill="#FFF6DD" opacity="0.4"/>
    </g>
    <g id="rollPiece">
      <ellipse cx="4" cy="34" rx="56" ry="12" fill="#0E2418" opacity="0.3" filter="url(#softer)"/>
      <ellipse rx="58" ry="42" fill="url(#katli)" stroke="#BFA06F" stroke-width="2"/>
      <ellipse rx="38" ry="27" fill="#8FA36A"/>
      <ellipse rx="20" ry="14" fill="#6E8450"/>
      <ellipse cx="-14" cy="-20" rx="18" ry="6" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <g id="jamunPiece">
      <circle r="44" fill="url(#jamun)"/>
      <ellipse cx="-14" cy="-18" rx="12" ry="7" fill="#FFFFFF" opacity="0.38"/>
    </g>
    <ellipse id="petal" rx="16" ry="8" fill="#A8323F"/>
  </defs>

  <rect width="1200" height="1300" fill="url(#light)"/>
  <!-- Fine gold arch ornament -->
  <path d="M220 330 Q600 20 980 330" fill="none" stroke="#C99543" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M260 340 Q600 70 940 340" fill="none" stroke="#C99543" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="600" cy="150" r="10" fill="#C99543" opacity="0.5"/>

  <!-- Table -->
  <rect y="980" width="1200" height="320" fill="#10281B" opacity="0.55"/>

  <!-- Thali -->
  <ellipse cx="610" cy="930" rx="500" ry="140" fill="#0A1B12" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="600" cy="800" rx="510" ry="310" fill="url(#brass)"/>
  <ellipse cx="600" cy="790" rx="468" ry="280" fill="url(#brassInner)"/>
  <ellipse cx="600" cy="790" rx="430" ry="254" fill="none" stroke="#8C6222" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <ellipse cx="600" cy="790" rx="380" ry="220" fill="#C99543" opacity="0.25"/>

  <!-- Kaju katli, left -->
  <use href="#katliPiece" xlink:href="#katliPiece" x="300" y="700"/>
  <use href="#katliPiece" xlink:href="#katliPiece" x="400" y="660"/>
  <use href="#katliPiece" xlink:href="#katliPiece" x="350" y="770"/>
  <use href="#katliPiece" xlink:href="#katliPiece" x="250" y="805"/>
  <use href="#katliPiece" xlink:href="#katliPiece" x="455" y="745"/>

  <!-- Laddoo pyramid, back centre -->
  <use href="#laddooPiece" xlink:href="#laddooPiece" x="560" y="640"/>
  <use href="#laddooPiece" xlink:href="#laddooPiece" x="680" y="640"/>
  <use href="#laddooPiece" xlink:href="#laddooPiece" x="620" y="560"/>

  <!-- Pistachio rolls, right -->
  <use href="#rollPiece" xlink:href="#rollPiece" x="840" y="690"/>
  <use href="#rollPiece" xlink:href="#rollPiece" x="930" y="760"/>
  <use href="#rollPiece" xlink:href="#rollPiece" x="810" y="800"/>

  <!-- Gulab jamun bowl, front -->
  <ellipse cx="640" cy="960" rx="190" ry="44" fill="#0A1B12" opacity="0.45" filter="url(#softer)"/>
  <path d="M460 860 Q470 960 640 968 Q810 960 820 860 Z" fill="#E8DCCB"/>
  <ellipse cx="640" cy="860" rx="180" ry="56" fill="#F8F0E4"/>
  <ellipse cx="640" cy="866" rx="160" ry="44" fill="#C97A2C" opacity="0.75"/>
  <use href="#jamunPiece" xlink:href="#jamunPiece" x="570" y="858"/>
  <use href="#jamunPiece" xlink:href="#jamunPiece" x="660" y="852"/>
  <use href="#jamunPiece" xlink:href="#jamunPiece" x="740" y="866"/>
  <ellipse cx="640" cy="880" rx="150" ry="20" fill="#F4B261" opacity="0.35"/>

  <!-- Petals & pistachio slivers -->
  <g opacity="0.9">
    <use href="#petal" xlink:href="#petal" transform="translate(180 960) rotate(20)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(230 1010) rotate(-30)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(960 980) rotate(40)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(1010 930) rotate(-10)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(900 1040) rotate(70)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(140 1060) rotate(-60)"/>
  </g>
  <g fill="#8FA36A">
    <ellipse cx="610" cy="520" rx="9" ry="4" transform="rotate(30 610 520)"/>
    <ellipse cx="636" cy="530" rx="9" ry="4" transform="rotate(-20 636 530)"/>
    <ellipse cx="380" cy="630" rx="9" ry="4" transform="rotate(10 380 630)"/>
    <ellipse cx="880" cy="650" rx="9" ry="4" transform="rotate(-40 880 650)"/>
  </g>

  <text x="1176" y="1276" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#FFF6EA" fill-opacity="0.55">Demo illustration · replace with product photography</text>
</svg>
