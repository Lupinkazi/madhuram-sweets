<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Demo illustration: layered premium sweets with gold leaf on a marble board</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24543A"/><stop offset="1" stop-color="#183D2B"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF7F0"/><stop offset="1" stop-color="#DDD3C4"/></linearGradient>
    <linearGradient id="layerA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EEDDBC"/><stop offset="1" stop-color="#D8BF92"/></linearGradient>
    <linearGradient id="layerB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DB07A"/><stop offset="1" stop-color="#71845A"/></linearGradient>
    <linearGradient id="layerC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A4A33"/><stop offset="1" stop-color="#5E2B1C"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="s">
      <ellipse cx="6" cy="64" rx="96" ry="14" fill="#0E2418" opacity="0.35" filter="url(#blur2)"/>
      <rect x="-90" y="-60" width="180" height="40" rx="6" fill="url(#layerA)"/>
      <rect x="-90" y="-22" width="180" height="26" fill="url(#layerB)"/>
      <rect x="-90" y="4" width="180" height="22" fill="url(#layerC)"/>
      <rect x="-90" y="26" width="180" height="34" rx="6" fill="url(#layerA)"/>
      <path d="M-60 -62l14-8 12 6 18-10 10 8 22-6 8 10" fill="none" stroke="#E9C27A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-90" y="-60" width="180" height="10" rx="5" fill="#FFFFFF" opacity="0.35"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <path d="M0 700 H1200" stroke="#C99543" stroke-opacity="0.3" stroke-width="2"/>
  <ellipse cx="620" cy="720" rx="520" ry="70" fill="#0A1B12" opacity="0.6" filter="url(#blur)"/>
  <rect x="110" y="380" width="980" height="320" rx="30" fill="url(#board)"/>
  <path d="M180 430c120 40 240-20 360 30s220 10 300-10 140 30 200 60" fill="none" stroke="#C8BEB0" stroke-width="2" opacity="0.7"/>
  <path d="M200 620c140-30 260 30 420 0s240-40 360 10" fill="none" stroke="#C8BEB0" stroke-width="2" opacity="0.6"/>
  <use href="#s" xlink:href="#s" x="340" y="520"/><use href="#s" xlink:href="#s" x="600" y="500"/><use href="#s" xlink:href="#s" x="860" y="530"/>
  <g fill="#8FA36A"><ellipse cx="470" cy="650" rx="10" ry="5" transform="rotate(30 470 650)"/><ellipse cx="740" cy="660" rx="10" ry="5" transform="rotate(-20 740 660)"/><ellipse cx="990" cy="650" rx="10" ry="5"/></g>
  <circle cx="600" cy="200" r="70" fill="none" stroke="#C99543" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="600" cy="200" r="50" fill="none" stroke="#C99543" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="1176" y="880" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#FFF6EA" fill-opacity="0.6">Demo illustration</text>
</svg>
