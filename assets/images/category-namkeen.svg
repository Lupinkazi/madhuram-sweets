    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="cashew" d="M0 0c-16-20 4-40 24-29 11 7 5 18-4 13-9-3-13 5-7 13z" fill="#E2BE80" stroke="#B98940" stroke-width="1.5"/>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="380" cy="640" rx="280" ry="50" fill="#3E2412" opacity="0.25" filter="url(#blur)"/>
  <path d="M120 440 Q130 640 380 646 Q630 640 640 440 Z" fill="url(#bowl)"/>
  <ellipse cx="380" cy="440" rx="262" ry="80" fill="#24543A"/>
  <ellipse cx="380" cy="436" rx="240" ry="66" fill="url(#sev)"/>
  <ellipse cx="840" cy="560" rx="240" ry="44" fill="#3E2412" opacity="0.25" filter="url(#blur)"/>
  <path d="M620 380 Q630 556 840 562 Q1050 556 1060 380 Z" fill="url(#bowl)"/>
  <ellipse cx="840" cy="380" rx="222" ry="68" fill="#24543A"/>
  <ellipse cx="840" cy="376" rx="202" ry="56" fill="url(#moth)"/>
