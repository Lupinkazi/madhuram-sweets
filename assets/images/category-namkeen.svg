<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Demo illustration: bowls of sev, dal moth and roasted cashews</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.25" r="0.95"><stop offset="0" stop-color="#F5EBDA"/><stop offset="1" stop-color="#DCC7A4"/></radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A7653"/><stop offset="1" stop-color="#24543A"/></linearGradient>
    <pattern id="sev" width="40" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 6q10-6 18 0t18 0" fill="none" stroke="#E8B44F" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 16q10-6 20 0t20 0" fill="none" stroke="#C98A2B" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <pattern id="moth" width="22" height="18" patternUnits="userSpaceOnUse">
